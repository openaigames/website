<body><main class="room" aria-label="OpenAIGames 游戏机"><div class="setup">
<div class="machine"><section class="monitor" aria-label="游戏显示器"><div class="monitor-top"><h1 class="wordmark">OpenAI<span>Games</span></h1><span class="engraving">一起，做点好玩的。</span></div><div class="display-unit"><div class="bezel"><div class="glass" id="screen"><div class="screen-center"><span class="boot-logo">OpenAIGames</span><p>正在读取卡带…</p></div></div></div><div class="monitor-side"><button class="dial" data-action="sound" aria-label="开启按键音效" aria-pressed="false"><i></i></button><span>SOUND</span><div class="speaker" aria-hidden="true"></div><button class="small-hardware" data-action="fullscreen" aria-label="全屏显示器">⛶</button><span>FULL SCREEN</span></div></div><div class="monitor-bottom"><span><i class="power-led" id="power-led"></i>STEREO</span><span class="monitor-type">PLAY TOGETHER</span></div></section>
